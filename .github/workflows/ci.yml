name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ──────────────────────────────────────────────────
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      # ── 3. Install dependencies ──────────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install fastapi uvicorn pydantic openai httpx pytest pytest-asyncio openenv-core

      # ── 4. Syntax check — all Python files ──────────────────────────────
      - name: Syntax check
        run: |
          python -m py_compile grader.py
          python -m py_compile models.py
          python -m py_compile server/my_env_environment.py
          python -m py_compile server/app.py
          python -m py_compile inference.py
          echo "All files passed syntax check."

      # ── 5. Unit tests ────────────────────────────────────────────────────
      - name: Run unit tests
        run: pytest tests/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/server

      # ── 6. Start server/app.py in background ────────────────────────────
      #    PYTHONPATH must include both root (grader.py, models.py)
      #    AND server/ (my_env_environment.py) so all imports resolve
      - name: Start background server
        run: |
          export PYTHONPATH=$(pwd):$(pwd)/server
          python server/app.py &
          # Poll /health until ready (max 30 s)
          for i in $(seq 1 15); do
            if curl -sf http://localhost:7860/health > /dev/null 2>&1; then
              echo "Server ready after $((i*2))s"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:7860/health || (echo "ERROR: server failed to start" && exit 1)

      # ── 7. Smoke tests ───────────────────────────────────────────────────
      - name: Smoke test /health
        run: curl -sf http://localhost:7860/health

      - name: Smoke test /tasks
        run: curl -sf http://localhost:7860/tasks

      - name: Smoke test /reset
        run: |
          curl -sf -X POST http://localhost:7860/reset \
            -H "Content-Type: application/json" \
            -d '{}' | python -c "
          import sys, json
          data = json.load(sys.stdin)
          assert 'observation' in data, 'Missing observation'
          assert 'email' in data['observation'], 'Missing email'
          assert data['reward'] >= 0.01, 'Reward below minimum'
          print('PASS /reset — email:', data['observation']['email'][:60])
          "

      - name: Smoke test /step
        run: |
          curl -sf -X POST http://localhost:7860/step \
            -H "Content-Type: application/json" \
            -d '{"label":"urgent","summary":"Server is down","reply":"We are escalating immediately. We sincerely apologise.","department":"engineering"}' \
            | python -c "
          import sys, json
          data = json.load(sys.stdin)
          assert 'reward' in data, 'Missing reward'
          assert 0.01 <= data['reward'] <= 0.99, f'Reward out of range: {data[\"reward\"]}'
          print('PASS /step — reward:', data['reward'])
          "

      - name: Smoke test /state
        run: |
          curl -sf http://localhost:7860/state | python -c "
          import sys, json
          data = json.load(sys.stdin)
          assert 'episode_id' in data
          assert 'step_count' in data
          print('PASS /state:', data)
          "

      # ── 8. Run inference (only when HF_TOKEN secret is available) ────────
      - name: Run agent inference
        if: ${{ env.HF_TOKEN != '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          API_BASE_URL: https://router.huggingface.co/v1
          MODEL_NAME: Qwen/Qwen2.5-72B-Instruct
          SPACE_URL: http://localhost:7860
        run: python inference.py
