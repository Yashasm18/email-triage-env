name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install fastapi uvicorn pydantic openai httpx pytest pytest-asyncio openenv-core

      - name: Syntax check
        run: |
          python -m py_compile grader.py
          python -m py_compile models.py
          python -m py_compile server/my_env_environment.py
          echo "All files passed syntax check."

      - name: Run unit tests
        run: pytest tests/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/server
