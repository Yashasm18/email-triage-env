name: email-triage-env
version: "1.0.0"
description: >
  A real-world email triage environment where an AI agent must classify,
  summarize, route, and reply to emails of increasing complexity.
  Tasks range from simple spam/label classification (easy) to
  multi-field routing with department assignment and professional reply drafting (hard).

author: souller
tags:
  - openenv
  - email
  - triage
  - nlp
  - real-world

tasks:
  - id: easy
    description: Classify the email label (spam, personal, work, urgent)
    difficulty: easy

  - id: medium
    description: Classify label, write a summary, and draft a reply with keyword matching
    difficulty: medium

  - id: hard
    description: Classify label, identify department, write summary, and draft a reply
    difficulty: hard

observation_space:
  type: object
  fields:
    email:
      type: string
      description: The email text to process
    done:
      type: boolean
      description: Whether the episode is complete
    reward:
      type: float
      description: Reward from the last step
    metadata:
      type: object
      description: Task ID, instruction, and step count

action_space:
  type: object
  fields:
    label:
      type: string
      enum: [spam, personal, work, urgent]
      description: Email classification label
    summary:
      type: string
      description: Brief summary of the email (required for medium/hard)
    reply:
      type: string
      description: Professional reply draft (required for medium/hard)
    department:
      type: string
      enum: [engineering, support, sales, billing, marketing, legal, security, management, none]
      description: Department to route the email to (required for hard)

reward:
  range: [0.0, 1.0]
  description: >
    Partial reward based on label correctness (0.5), reply keyword coverage (0.3),
    summary quality (0.2), and department routing (0.2 for hard).

endpoints:
  reset: POST /reset
  step: POST /step
  state: GET /state
